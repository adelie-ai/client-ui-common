[workspace]
# The pure reducer (this root package) + the native C-ABI core that wraps it.
# The reducer stays transport-free and wasm-clean (built with `-p
# client-ui-common --target wasm32`); the `ffi` member is native-only (it pulls
# the `client-common` transport + tokio) and is what `adele-kde` links against.
#
# `markdown` is the shared markdown -> sanitized-HTML pipeline + CSP-pinned page
# templates the webview-based clients (adele-gtk, adele-mac) render assistant
# replies through. It is deliberately a SEPARATE member rather than part of the
# reducer: it pulls an HTML parser (`ammonia`/`html5ever`), which has no place in
# the wasm-clean root package.
members = ["ffi", "markdown"]
resolver = "2"

[package]
name = "client-ui-common"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
# The shared client core consumes only wasm-clean TYPES — never a transport.
# Wire types, the `SignalEvent` stream, and the client-facing conversation views
# (`api::client`) all come from desktop-assistant's `api-model`, which compiles
# to wasm32; `AdeleOutput` + its refinement gates come from
# `adele-voice-client-common` with the native `chunker` feature off. RPCs are
# expressed as `Effect`s the client runs, so no transport crate is needed here
# — which is what lets this crate (and the UIs that embed it) target wasm.
#
# Blocked-by: desktop-assistant#387 (api-model wasm-clean: SignalEvent +
# api::client) and voice#116 (optional chunker → wasm-clean AdeleOutput). Until
# both land on their repos' main, build against those branches.
#
# NOTE: client-consumption dependency-SOURCING (git vs path vs `[patch]`) is
# still being resolved so `api-model` isn't duplicated in a client's build graph.
desktop-assistant-api-model = { path = "../desktop-assistant/crates/api-model" }
adele-voice-client-common = { path = "../voice/crates/client-voice", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Collapse mcp-core to a SINGLE source, exactly as adele-gtk/adele-tui do.
# `client-common` pins mcp-core to a git rev while the built-in server libs the
# `ffi` member optionally links (fileio/terminal/tasks/web + the broad set)
# float the same git dep unpinned. Two git sources would split
# `mcp_core::McpService` into two incompatible types (E0308) the moment a
# built-in's `Arc<dyn McpService>` is handed to `BuiltinServer::new`. Patching
# the URL to the local checkout resolves every consumer to one mcp-core.
#
# Lives at the workspace ROOT because cargo only honors `[patch]` there — the
# same table in `ffi/Cargo.toml` would be silently ignored.
#
# CONSEQUENCE, and it is not feature-gated: `[patch]` applies to EVERY build of
# this workspace, including the default (no `mcp-*` features) one adele-kde
# links. So the default build no longer resolves client-common's pinned mcp-core
# rev from git — it resolves `../mcp-core` — and this workspace now REQUIRES that
# sibling checkout to build at all. adele-gtk and adele-tui already carry the
# identical patch and requirement, and adele-kde's `client-build` already assumes
# the sibling layout, so this aligns client-ui-common with them rather than
# introducing a new convention. What is unchanged for adele-kde is the linked
# code: a default build still compiles in zero built-in MCP servers.
[patch."https://github.com/adelie-ai/mcp-core"]
mcp-core = { path = "../mcp-core" }
