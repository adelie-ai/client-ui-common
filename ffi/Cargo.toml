[package]
name = "client-ui-ffi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Native C-ABI core for C/C++ Adelie clients: owns the client-ui-common reducer + a client-common Connector, runs RPC effects, and pushes view-effects out as JSON over a C callback."

# A C dynamic library: `libadele_client_core.so`. The header is generated to
# `include/adele_client_core.h` by `build.rs` (cbindgen) for the C++ consumer
# (adele-kde's CMake) to include.
[lib]
name = "adele_client_core"
# `cdylib` is the C-ABI artifact adele-kde links; `rlib` lets the unit tests
# (and any future Rust consumer) build against the crate.
crate-type = ["cdylib", "rlib"]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"

# Compiled-in ("built-in") MCP servers hosted in-process (da#538), the same
# mechanism adele-gtk and adele-tui use — but **default-OFF here**. This cdylib
# is linked by BOTH adele-kde and adele-mac, and KDE's canonical build must stay
# byte-identical: with no feature selected, none of the server crates are linked
# and the engine hosts exactly what `client-mcp.toml` configures, as before.
#
# adele-mac opts in from its justfile (`just build-with-mcp …`), which is what
# makes a Mac build ship the core set (or the broad set) compiled in.
[features]
default = []
builtin-core = ["mcp-fileio", "mcp-terminal", "mcp-tasks", "mcp-web"]
mcp-fileio = ["dep:fileio-mcp"]
mcp-terminal = ["dep:terminal-mcp"]
mcp-tasks = ["dep:tasks-mcp"]
mcp-web = ["dep:web-mcp"]

# The "broad set" — the same fleet Adele ships on the daemon, minus the core-4.
# Hosted in-process exactly like the core set; opt-in via this umbrella or a
# single `mcp-*`.
builtin-extras = [
    "mcp-weather",
    "mcp-internet-radio",
    "mcp-openstreetmap",
    "mcp-geocode",
    "mcp-skills",
]
mcp-weather = ["dep:weather-forecast-mcp"]
mcp-internet-radio = ["dep:internet-radio-mcp"]
mcp-openstreetmap = ["dep:openstreetmap-mcp"]
mcp-geocode = ["dep:geocode-mcp"]
mcp-skills = ["dep:skills-mcp"]

[dependencies]
# The shared view-agnostic reducer (WindowState/Effect/UiMessage) + its
# re-exports (AdeleOutput, ContextUsageView, SelectedModel, the signal->message
# map, the voice-mode client-tool registrations).
client-ui-common = { path = ".." }

# The shared markdown -> sanitized-HTML -> CSP-locked-page pipeline (gtk#25's
# security boundary). Exposed over the C ABI so adele-mac, which has no Rust of
# its own, renders assistant replies through the SAME sanitizer as adele-gtk.
adele-markdown = { path = "../markdown" }

# Protocol TYPES (api::client conversation views, SignalEvent, Command /
# CommandResult, the model/task/scratchpad views).
desktop-assistant-api-model = { path = "../../desktop-assistant/crates/api-model" }

# The actual transport. Default features keep the `dbus` transport on — KDE's
# canonical path is `TransportMode::Dbus` (the org.desktopAssistant bridge); UDS
# and WS are also reachable through the same `Connector`. `mcp-host` adds the
# client-side MCP host (run local MCP servers on the edge, advertise their tools
# to the daemon as client-side tools). It pulls the stdio MCP client + toml but
# — since desktop-assistant#475 — NOT the HTTP/reqwest transport.
desktop-assistant-client-common = { path = "../../desktop-assistant/crates/client-common", features = [
    "mcp-host",
] }

# The built-in MCP server libs (see `[features]` above). Each exposes a
# `build_service()` the engine hands to `McpHost::start_with_disabled` for
# in-process hosting — no subprocess. Optional + feature-gated, so a default
# build (adele-kde's) links none of them. Sibling path-deps, two levels up
# because this member sits under `client-ui-common/`.
fileio-mcp = { path = "../../fileio-mcp", optional = true }
terminal-mcp = { path = "../../terminal-mcp", optional = true }
tasks-mcp = { path = "../../tasks-mcp", optional = true }
web-mcp = { path = "../../web-mcp", optional = true }
weather-forecast-mcp = { path = "../../weather-forecast-mcp", optional = true }
internet-radio-mcp = { path = "../../internet-radio-mcp", optional = true }
openstreetmap-mcp = { path = "../../openstreetmap-mcp", optional = true }
geocode-mcp = { path = "../../geocode-mcp", optional = true }
skills-mcp = { path = "../../skills-mcp", optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Mints a per-send idempotency key (#570) for the reducer to stamp on the
# optimistic bubble and forward on the wire. The reducer stays wasm-clean and
# never mints UUIDs itself — the native FFI host does it here.
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
# Integration tests only see the crate under test + dev-deps, so the markdown
# spec needs its own handle on the shared crate to assert the C ABI's exported
# bridge names match it.
adele-markdown = { path = "../markdown" }
# The conversation-inventory spec stands a fake daemon up at the transport's own
# trait boundary (`AssistantClient`), so it needs that trait's own tools: the
# `#[async_trait]` attribute it is declared with, and the `anyhow` error type its
# methods return.
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
# The client-MCP-host wiring tests spin up a `/bin/sh` fake MCP server from a
# temp dir (mirroring the `mcp_host` unit tests).
tempfile = "3"
# The panic_guard spec captures the tracing output guard() emits, to check a
# caught panic is logged with its payload and location. A hand-rolled
# Subscriber would duplicate what this crate already tests; it also sits in
# the dependency tree already (pulled in by other workspace members), so this
# adds no new crate to the build.
tracing-subscriber = "0.3"
